<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <rect width="900" height="500" rx="15" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Title -->
  <text x="450" y="40" font-family="'Outfit', 'Inter', sans-serif" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle">Spesifikasi Teknologi Aplikasi Tag-Aja</text>
  
  <!-- Client Side -->
  <g transform="translate(100, 100)">
    <rect width="300" height="340" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.05))"/>
    <rect width="300" height="50" rx="12" fill="#0284c7"/>
    <rect y="40" width="300" height="10" fill="#0284c7"/>
    <text x="150" y="32" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Sisi Pengguna (Client)</text>
    
    <text x="35" y="90" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Teknologi Web &amp; API:</text>
    
    <circle cx="45" cy="130" r="8" fill="#38bdf8"/>
    <text x="65" y="134" font-family="sans-serif" font-size="13" fill="#1e293b">Responsive Web Browser (Mobile &amp; PC)</text>
    
    <circle cx="45" cy="170" r="8" fill="#38bdf8"/>
    <text x="65" y="174" font-family="sans-serif" font-size="13" fill="#1e293b">HTML5 Geolocation API (Deteksi GPS)</text>
    
    <circle cx="45" cy="210" r="8" fill="#38bdf8"/>
    <text x="65" y="214" font-family="sans-serif" font-size="13" fill="#1e293b">Tailwind CSS &amp; Flowbite Components</text>
    
    <circle cx="45" cy="250" r="8" fill="#38bdf8"/>
    <text x="65" y="254" font-family="sans-serif" font-size="13" fill="#1e293b">Alpine.js &amp; Axios (AJAX Requests)</text>
    
    <text x="35" y="300" font-family="sans-serif" font-size="12" font-style="italic" fill="#64748b">Kebutuhan Hardware: Smartphone Cukup RAM 2GB</text>
    <text x="35" y="320" font-family="sans-serif" font-size="12" font-style="italic" fill="#64748b">dengan kamera internal dan GPS aktif.</text>
  </g>

  <!-- Server Side -->
  <g transform="translate(500, 100)">
    <rect width="300" height="340" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.05))"/>
    <rect width="300" height="50" rx="12" fill="#475569"/>
    <rect y="40" width="300" height="10" fill="#475569"/>
    <text x="150" y="32" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Sisi Web Server</text>
    
    <text x="35" y="90" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Arsitektur Backend:</text>
    
    <circle cx="45" cy="130" r="8" fill="#94a3b8"/>
    <text x="65" y="134" font-family="sans-serif" font-size="13" fill="#1e293b">Laravel 11.x MVC (PHP Web Framework)</text>
    
    <circle cx="45" cy="170" r="8" fill="#94a3b8"/>
    <text x="65" y="174" font-family="sans-serif" font-size="13" fill="#1e293b">PHP 8.2+ dengan GD Library (Kompresi Foto)</text>
    
    <circle cx="45" cy="210" r="8" fill="#94a3b8"/>
    <text x="65" y="214" font-family="sans-serif" font-size="13" fill="#1e293b">MySQL 8.0 / MariaDB (Penyimpanan Data)</text>
    
    <circle cx="45" cy="250" r="8" fill="#94a3b8"/>
    <text x="65" y="254" font-family="sans-serif" font-size="13" fill="#1e293b">Laragon / Nginx Web Server (Localhost)</text>
    
    <text x="35" y="300" font-family="sans-serif" font-size="12" font-style="italic" fill="#64748b">Kebutuhan Server VPS: vCPU 2 Core, RAM 4GB,</text>
    <text x="35" y="320" font-family="sans-serif" font-size="12" font-style="italic" fill="#64748b">SSD 40GB untuk kelancaran penyimpanan foto.</text>
  </g>

  <!-- Flow Arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
  </defs>
  <line x1="410" y1="240" x2="490" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="280" x2="410" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="225" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">HTTP POST</text>
  <text x="450" y="305" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">JSON Response</text>
</svg>

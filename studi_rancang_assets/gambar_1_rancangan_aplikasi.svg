<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <rect width="900" height="550" rx="15" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Title -->
  <text x="450" y="40" font-family="'Outfit', 'Inter', sans-serif" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle">Rancangan Arsitektur Aplikasi Tag-Aja</text>
  
  <!-- Left Side: Petugas Lapangan (Input) -->
  <g transform="translate(50, 150)">
    <rect width="200" height="260" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.05))"/>
    <rect width="200" height="50" rx="12" fill="#0284c7"/>
    <rect y="40" width="200" height="10" fill="#0284c7"/>
    <text x="100" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Petugas Lapangan</text>
    
    <!-- Icon Placeholder -->
    <circle cx="100" cy="95" r="25" fill="#e0f2fe"/>
    <path d="M85 135 C85 115, 115 115, 115 135 Z" fill="#0284c7"/>
    <circle cx="100" cy="90" r="10" fill="#0284c7"/>
    
    <!-- Tasks -->
    <text x="20" y="165" font-family="sans-serif" font-size="12" fill="#334155">• Input Data Keluarga</text>
    <text x="20" y="190" font-family="sans-serif" font-size="12" fill="#334155">• Geotagging (GPS)</text>
    <text x="20" y="215" font-family="sans-serif" font-size="12" fill="#334155">• Upload Foto Rumah</text>
    <text x="100" y="245" font-family="sans-serif" font-size="11" font-style="italic" fill="#64748b" text-anchor="middle">Mobile Web View</text>
  </g>

  <!-- Middle: Laravel Web Server -->
  <g transform="translate(320, 110)">
    <rect width="260" height="340" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2" filter="drop-shadow(0px 6px 10px rgba(99,102,241,0.15))"/>
    <rect width="260" height="50" rx="12" fill="#6366f1"/>
    <rect y="40" width="260" height="10" fill="#6366f1"/>
    <text x="130" y="32" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Laravel Server &amp; Controller</text>
    
    <!-- Process Steps -->
    <text x="30" y="90" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Validasi &amp; Kompresi:</text>
    
    <!-- Step 1 -->
    <rect x="20" y="110" width="220" height="45" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="30" y="128" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5b21b6">1. Image Compression</text>
    <text x="30" y="145" font-family="sans-serif" font-size="10" fill="#7c3aed">Kompres foto > 1MB ke JPEG 60%</text>
    
    <!-- Step 2 -->
    <rect x="20" y="170" width="220" height="45" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="30" y="188" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5b21b6">2. Data Constraints</text>
    <text x="30" y="205" font-family="sans-serif" font-size="10" fill="#7c3aed">Hanya 1 Kepala Keluarga, NIK Unik</text>
    
    <!-- Step 3 -->
    <rect x="20" y="230" width="220" height="45" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="30" y="248" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5b21b6">3. Role-Based Filters</text>
    <text x="30" y="265" font-family="sans-serif" font-size="10" fill="#7c3aed">Batas akses per Kelurahan/Wilayah</text>

    <!-- Step 4 -->
    <rect x="20" y="290" width="220" height="35" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="130" y="312" font-family="sans-serif" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">Ekspor CSV Data Terpadu</text>
  </g>

  <!-- Right Side: Database MySQL -->
  <g transform="translate(650, 150)">
    <rect width="200" height="260" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.05))"/>
    <rect width="200" height="50" rx="12" fill="#475569"/>
    <rect y="40" width="200" height="10" fill="#475569"/>
    <text x="100" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">MySQL Database</text>
    
    <!-- DB Icon -->
    <path d="M100 80 C130 80, 145 85, 145 90 C145 95, 130 100, 100 100 C70 100, 55 95, 55 90 C55 85, 70 80, 100 80 Z" fill="#94a3b8"/>
    <path d="M55 90 L55 110 C55 115, 70 120, 100 120 C130 120, 145 115, 145 110 L145 90 Z" fill="#64748b"/>
    <path d="M55 110 L55 130 C55 135, 70 140, 100 140 C130 140, 145 135, 145 130 L145 110 Z" fill="#475569"/>
    
    <!-- Tables -->
    <text x="20" y="175" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Tabel Utama:</text>
    <text x="20" y="200" font-family="sans-serif" font-size="12" fill="#334155">• users (Roles &amp; Wilayah)</text>
    <text x="20" y="225" font-family="sans-serif" font-size="12" fill="#334155">• families (KK, GPS, Foto)</text>
    <text x="20" y="250" font-family="sans-serif" font-size="12" fill="#334155">• family_members (NIK, ART)</text>
  </g>

  <!-- Bottom: Admin & Supervisor Web Access -->
  <g transform="translate(320, 480)">
    <rect width="260" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="130" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Akses Web Dashboard Admin &amp; Supervisor</text>
  </g>

  <!-- Connectors -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Petugas -> Server -->
  <line x1="250" y1="280" x2="310" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="265" font-family="sans-serif" font-size="10" fill="#475569" text-anchor="middle">HTTP POST</text>

  <!-- Server -> DB -->
  <line x1="580" y1="280" x2="640" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="265" font-family="sans-serif" font-size="10" fill="#475569" text-anchor="middle">Query/Save</text>

  <!-- Admin/SP Dashboard -> Server -->
  <line x1="450" y1="475" x2="450" y2="455" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
